name: Build Colour Partner APK

on:
  push:
    paths:
      - "public/colors/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ColourPartner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ColourPartner-apk
          path: ColourPartner.apk

      # Always-current download link: Releases → "Colour Partner (latest)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete colour-partner-latest --cleanup-tag --yes || true
          gh release create colour-partner-latest ColourPartner.apk \
            --title "Colour Partner (latest)" \
            --notes "Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download ColourPartner.apk on your phone and open it to install." \
            --target "${{ github.sha }}"
